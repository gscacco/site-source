<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="cronx-observability-title cronx-observability-desc">
  <title id="cronx-observability-title">Execution history and process output connected by a run identifier</title>
  <desc id="cronx-observability-desc">Structured run records in SQLite sit beside a shared text log. A highlighted run identifier connects a successful execution record to its corresponding log line.</desc>

  <defs>
    <marker id="arrow-cronx-observability" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a45c36"/>
    </marker>
  </defs>

  <g fill="none" stroke="#d9d2c3" stroke-width="1">
    <path d="M40 70H860M40 210H860M40 350H860"/>
    <path d="M180 40V390M450 40V390M720 40V390"/>
  </g>

  <g fill="none" stroke="#24251f" stroke-width="1.5">
    <rect x="40" y="92" width="350" height="280"/>
    <rect x="510" y="92" width="350" height="280"/>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#6b6a63" letter-spacing="1.2">
    <text x="64" y="120">EXECUTION HISTORY / SQLITE</text>
    <text x="534" y="120">PROCESS OUTPUT / SHARED LOG</text>
    <text x="64" y="160">ID</text>
    <text x="120" y="160">ATTEMPT</text>
    <text x="230" y="160">STATUS</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#24251f">
    <text x="64" y="202">10</text>
    <text x="120" y="202">1</text>
    <text x="230" y="202">failed</text>
    <text x="64" y="244">11</text>
    <text x="120" y="244">2</text>
    <text x="230" y="244">failed</text>
    <text x="64" y="286" fill="#8e4a2b">12</text>
    <text x="120" y="286" fill="#8e4a2b">1</text>
    <text x="230" y="286" fill="#8e4a2b">succeeded</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="11" fill="#24251f">
    <text x="534" y="202">run=10  upload failed</text>
    <text x="534" y="244">run=10  retrying upload</text>
    <text x="534" y="286" fill="#8e4a2b">run=12  backup completed</text>
  </g>

  <path d="M390 286H510" fill="none" stroke="#a45c36" stroke-width="1.6" marker-end="url(#arrow-cronx-observability)"/>
  <circle cx="390" cy="286" r="4" fill="#a45c36"/>
  <circle cx="510" cy="286" r="4" fill="#a45c36"/>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#8e4a2b" letter-spacing=".9">
    <text x="414" y="276">same run id</text>
    <text x="414" y="306">join point</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#6b6a63" letter-spacing="1">
    <text x="64" y="408">WHAT HAPPENED</text>
    <text x="534" y="408">WHAT THE PROCESS SAID</text>
  </g>

  <path d="M40 390H860" stroke="#24251f" stroke-width="1"/>
  <text x="40" y="424" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#6b6a63" letter-spacing="1.2">TWO STORES / ONE EXECUTION IDENTIFIER</text>
</svg>
