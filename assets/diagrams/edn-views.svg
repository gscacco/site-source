<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="edn-views-title edn-views-desc">
  <title id="edn-views-title">One EDN structure, three complementary views</title>
  <desc id="edn-views-desc">An EDN map on the left branches into an interactive tree, a table, and a text editor, all representing the same underlying data.</desc>

  <g fill="none" stroke="#d9d2c3" stroke-width="1">
    <path d="M40 70H860M40 210H860M40 350H860"/>
    <path d="M270 30V390M300 30V390M600 30V390"/>
  </g>

  <g fill="none" stroke="#24251f" stroke-width="1.5">
    <rect x="40" y="118" width="200" height="184"/>
    <rect x="330" y="42" width="260" height="104"/>
    <rect x="330" y="178" width="260" height="104"/>
    <rect x="330" y="314" width="260" height="74"/>
  </g>

  <path d="M240 210H285V94H330M240 210H330M240 210H285V351H330" fill="none" stroke="#a45c36" stroke-width="1.5"/>
  <circle cx="285" cy="94" r="3" fill="#a45c36"/>
  <circle cx="285" cy="210" r="3" fill="#a45c36"/>
  <circle cx="285" cy="351" r="3" fill="#a45c36"/>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#6b6a63" letter-spacing="1.2">
    <text x="40" y="106">CANONICAL DATA</text>
    <text x="330" y="30">VIEW / TREE</text>
    <text x="330" y="166">VIEW / TABLE</text>
    <text x="330" y="302">VIEW / TEXT</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="12" fill="#24251f">
    <text x="112" y="174">{:name</text>
    <text x="112" y="198"> "Garden"</text>
    <text x="112" y="222"> :budget</text>
    <text x="112" y="246"> [1200 3400]</text>
    <text x="112" y="270"> :status</text>
    <text x="112" y="294"> :active}</text>
  </g>

  <g fill="none" stroke="#77766f" stroke-width="1">
    <path d="M360 78h20M360 98h120M360 118h80"/>
    <path d="M360 214h20M360 234h170M360 254h120"/>
    <path d="M360 346h210M360 366h150"/>
  </g>

  <g fill="#a45c36">
    <circle cx="632" cy="70" r="4"/>
    <circle cx="632" cy="206" r="4"/>
    <circle cx="632" cy="342" r="4"/>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#6b6a63" letter-spacing="1">
    <text x="642" y="73">STRUCTURE</text>
    <text x="642" y="209">COMPARE</text>
    <text x="642" y="345">EDIT</text>
  </g>

  <path d="M40 390H860" stroke="#24251f" stroke-width="1"/>
  <text x="40" y="414" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#6b6a63" letter-spacing="1.2">SAME MODEL / DIFFERENT QUESTIONS</text>
</svg>
