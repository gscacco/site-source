<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="tcp-agent-title tcp-agent-desc">
  <title id="tcp-agent-title">Three queued actions and the state passed between them</title>
  <desc id="tcp-agent-desc">An agent receives three actions in order. Each action consumes the previous state and returns the state used by the next action, ending with a nil value in this minimal example.</desc>

  <defs>
    <marker id="arrow-tcp-agent" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a45c36"/>
    </marker>
  </defs>

  <g fill="none" stroke="#d9d2c3" stroke-width="1">
    <path d="M40 70H860M40 190H860M40 310H860"/>
    <path d="M180 40V340M450 40V340M720 40V340"/>
  </g>

  <rect x="40" y="60" width="820" height="260" fill="none" stroke="#a45c36" stroke-width="1.3" stroke-dasharray="6 7"/>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#6b6a63" letter-spacing="1.2">
    <text x="64" y="92">AGENT / SERIAL ACTION QUEUE</text>
  </g>

  <g fill="none" stroke="#24251f" stroke-width="1.5">
    <rect x="80" y="128" width="200" height="84"/>
    <rect x="350" y="128" width="200" height="84"/>
    <rect x="620" y="128" width="200" height="84"/>
  </g>

  <g fill="none" stroke="#a45c36" stroke-width="1.5" marker-end="url(#arrow-tcp-agent)">
    <path d="M280 170H350"/>
    <path d="M550 170H620"/>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#6b6a63" letter-spacing="1">
    <text x="104" y="154">ACTION / 01</text>
    <text x="374" y="154">ACTION / 02</text>
    <text x="644" y="154">ACTION / 03</text>
  </g>

  <g font-family="'Newsreader', Georgia, serif" font-size="21" fill="#24251f">
    <text x="104" y="190">create-server</text>
    <text x="374" y="190">accept-connection</text>
    <text x="644" y="190">print-string</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="10" fill="#24251f">
    <text x="80" y="248">{:server ss :socket nil}</text>
    <text x="350" y="248">{:server ss :socket s}</text>
    <text x="620" y="248">nil</text>
  </g>

  <g font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#8e4a2b" letter-spacing=".8">
    <text x="292" y="160">state</text>
    <text x="562" y="160">state</text>
    <text x="620" y="270">example ends here</text>
  </g>

  <g fill="#a45c36">
    <circle cx="350" cy="170" r="3"/>
    <circle cx="620" cy="170" r="3"/>
  </g>

  <text x="40" y="348" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="9" fill="#6b6a63" letter-spacing="1.2">EACH ACTION RETURNS THE STATE CONSUMED BY THE NEXT ONE</text>
</svg>
