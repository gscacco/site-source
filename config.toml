baseURL = "https://gscacco.github.io/"
locale = "en-US"
defaultContentLanguage = "en"
title = "G.Scacco"
description = "A blog about computer science and beyond"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[permalinks]
  post = "/post/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"
  topic = "topics"
  series = "series"

[params]
  author = "G. Scacco"
  tagline = "Programming and beyond"
  description = "A blog about computer science and beyond"

  [params.giscus]
    repo = "gscacco/site-source"
    repoId = "MDEwOlJlcG9zaXRvcnkzNzgwMzY2Mg=="
    category = "Announcements"
    categoryId = "DIC_kwDOAkDWjs4DKW0E"
    mapping = "pathname"
    strict = "1"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "light"
    lang = "en"
    loading = "lazy"

[markup]
  [markup.goldmark.renderer]
    unsafe = false
  [markup.highlight]
    noClasses = false
    lineNos = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[[menus.main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Posts"
  pageRef = "/post"
  weight = 20

[[menus.main]]
  name = "Projects"
  pageRef = "/projects"
  weight = 25

[[menus.main]]
  name = "Tags"
  pageRef = "/tags"
  weight = 30
