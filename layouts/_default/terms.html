{{ define "main" }}
  <header class="page-heading">
    <div class="page-heading__copy">
      <p class="eyebrow">Explore topics</p>
      <h1>{{ .Title }}</h1>
    </div>
  </header>
  <ul class="term-list">
    {{ range .Data.Terms.Alphabetical }}
      <li><a href="{{ .Page.RelPermalink }}"><span>{{ .Page.LinkTitle }}</span><span class="term-list__count">{{ .Count }}</span></a></li>
    {{ else }}
      <li class="empty-state">No topics yet.</li>
    {{ end }}
  </ul>
{{ end }}
