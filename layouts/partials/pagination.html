{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
  <nav class="pagination" aria-label="Pagination">
    <div class="pagination__links">
      {{ if $paginator.HasPrev }}<a class="text-link" href="{{ $paginator.Prev.URL }}">← Newer</a>{{ end }}
      {{ if $paginator.HasNext }}<a class="text-link" href="{{ $paginator.Next.URL }}">Older →</a>{{ end }}
    </div>
    <span class="pagination__count">Page {{ $paginator.PageNumber }} of {{ $paginator.TotalPages }}</span>
  </nav>
{{ end }}
