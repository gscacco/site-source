{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
  <nav class="pagination" aria-label="Paginazione">
    {{ if $paginator.HasPrev }}<a href="{{ $paginator.Prev.URL }}">← Più recenti</a>{{ end }}
    <span>Pagina {{ $paginator.PageNumber }} di {{ $paginator.TotalPages }}</span>
    {{ if $paginator.HasNext }}<a href="{{ $paginator.Next.URL }}">Più vecchi →</a>{{ end }}
  </nav>
{{ end }}
