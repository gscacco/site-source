<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ site.Home.RelPermalink }}">
      <span class="brand-name">{{ site.Title }}</span>
      <span class="brand-tagline">{{ site.Params.tagline }}</span>
    </a>
    <nav aria-label="Navigazione principale">
      <ul class="nav-list">
        {{ range site.Menus.main }}
          <li><a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
        {{ end }}
      </ul>
    </nav>
  </div>
</header>
