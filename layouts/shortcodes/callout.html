{{ $type := .Get "type" | default "note" }}
{{ $allowedTypes := slice "note" "tip" "warning" "context" }}
{{ if not (in $allowedTypes $type) }}{{ $type = "note" }}{{ end }}
<aside class="callout callout--{{ $type }}" role="note">
  <div class="callout__marker" aria-hidden="true"></div>
  <div class="callout__body">
    {{ with .Get "title" }}<p class="callout__label">{{ . }}</p>{{ end }}
    {{ .Inner | markdownify }}
  </div>
</aside>
